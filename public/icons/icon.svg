<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <!--
    Tap Talk app icon. The whole mark is drawn with one rounded 32-unit stroke
    (the same stroke as the wordmark's letters, scaled up). Every line keeps a
    clear gap from the next: the bars are 56 apart (24 between neighbors) and sit
    at least 22 inside the bubble, so nothing touches at any size. The bars keep
    the wordmark's "l" proportions, 64 : 112 : 44, measured including the round
    caps. Everything sits inside the central ~70% so Android's circular and
    squircle masks never clip it.
  -->
  <rect width="512" height="512" fill="#0f3e17"/>
  <g fill="none" stroke="#e1f4df" stroke-width="32" stroke-linecap="round" stroke-linejoin="round">
    <!-- Speech bubble: rounded rectangle with a tail at the bottom-left -->
    <path d="M166 134h180a46 46 0 0 1 46 46v116a46 46 0 0 1-46 46H228l-62 56v-56h-20a46 46 0 0 1-46-46V180a46 46 0 0 1 46-46Z"/>
    <!-- Three bars, centered horizontally, sharing the baseline at y=288 -->
    <path d="M200 246v42"/>
    <path d="M256 190v98"/>
    <path d="M312 269v19"/>
  </g>
</svg>
